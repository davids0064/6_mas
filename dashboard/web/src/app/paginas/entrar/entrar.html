<div class="acceso">
  <header class="acceso-encabezado">
    <a routerLink="/" class="acceso-marca">
      <img src="logo_blanco.png" alt="" aria-hidden="true" />
      <span>Seis Más</span>
    </a>
    <h1>Bienvenido de vuelta</h1>
    <p>Entra para gestionar tu comercio 👋</p>
  </header>

  <main class="acceso-cuerpo">
    <div class="acceso-tarjeta">
      @if (error()) {
        <div class="aviso aviso-error" role="alert">{{ error() }}</div>
      }

      <form [formGroup]="formulario" (ngSubmit)="entrar()" novalidate>
        <div class="campo" [class.invalido]="falla('email')">
          <label for="email">Correo</label>
          <input
            id="email"
            type="email"
            formControlName="email"
            placeholder="hola@tucomercio.com"
            autocomplete="email"
          />
          @if (falla('email')) {
            <span class="mensaje-error">Escribe un correo válido.</span>
          }
        </div>

        <div class="campo" [class.invalido]="falla('password')">
          <label for="password">Contraseña</label>
          <input
            id="password"
            type="password"
            formControlName="password"
            placeholder="Tu contraseña"
            autocomplete="current-password"
          />
          @if (falla('password')) {
            <span class="mensaje-error">Escribe tu contraseña.</span>
          }
        </div>

        <button type="submit" class="boton boton-cta boton-bloque mt-m" [disabled]="enviando()">
          {{ enviando() ? 'Entrando…' : 'Entrar' }}
        </button>
      </form>

      <p class="nota-confianza">
        ¿Aún no tienes cuenta? <a routerLink="/registro">Registra tu comercio</a>
      </p>
    </div>
  </main>
</div>
